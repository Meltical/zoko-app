name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Configuration et signature
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_KEY: $key}' > env.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zoko-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=zoko\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/zoko-release.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" \
            > android/key.properties

      - run: flutter pub get
      - run: flutter test
      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --dart-define-from-file=env.json \
            --build-name="$VERSION" --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk zoko.apk
          sha256sum zoko.apk > zoko.apk.sha256

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" zoko.apk zoko.apk.sha256 \
            --title "Zoko $VERSION" --generate-notes
